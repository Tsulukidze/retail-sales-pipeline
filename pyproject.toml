[project]
name = "retail-sales-pipeline"
version = "0.1.0"
description = "Daily retail sales ELT pipeline: Kaggle -> PostgreSQL DWH, orchestrated by Airflow"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
